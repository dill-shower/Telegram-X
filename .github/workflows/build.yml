name: Build Telegram X

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      abi:
        description: 'Target ABI (e.g. arm64, arm32, x64)'
        required: true
        default: 'arm64'

# Даем права боту сохранить сгенерированный ключ в репозиторий
permissions:
  contents: write

env:
  TERM: xterm
  RUSTUP_HOME: /home/runner/.rustup
  CARGO_HOME: /home/runner/.cargo

jobs:
  build:
    name: Build Release APK (${{ github.event.inputs.abi || 'arm64' }})
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository with Submodules and LFS
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 0

      - name: Expand Swap Space (Prevent OOM)
        run: |
          sudo swapoff -a
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'

      # Если ключа нет в репозитории — GitHub Actions создаст его и сам запушит в репо!
      - name: Ensure Persistent Keystore
        run: |
          if [ ! -f "release.jks" ]; then
            echo "Key not found. Generating persistent keystore in CI..."
            keytool -genkeypair -v -keystore release.jks -alias tgx -keyalg RSA -keysize 2048 -validity 10000 -storepass telegramx -keypass telegramx -dname "CN=TelegramX, O=Telegram, C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add release.jks
            git commit -m "Add persistent release keystore [skip ci]" || true
            git push || true
          else
            echo "Persistent keystore already exists."
          fi

      - name: Setup Exact Rust Toolchain & Targets
        run: |
          RUST_VERSION=$(grep "^version.rust=" version.properties | cut -d'=' -f2 | tr -d '\r\n ')
          echo "Target Rust version: $RUST_VERSION"

          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

          rustup target add aarch64-linux-android --toolchain "$RUST_VERSION"
          rustup target add armv7-linux-androideabi --toolchain "$RUST_VERSION"
          rustup target add x86_64-linux-android --toolchain "$RUST_VERSION"
          rustup target add i686-linux-android --toolchain "$RUST_VERSION"
          rustup component add llvm-tools --toolchain "$RUST_VERSION" || true

          chmod +x scripts/setup-rust.sh
          ./scripts/setup-rust.sh || true

          echo "$CARGO_HOME/bin" >> $GITHUB_PATH

          # Задаем кастомное имя пакета (не конфликтует с оригиналом)
          cat <<EOF > local.properties
          sdk.dir=$ANDROID_HOME
          rust.dir=$RUSTUP_HOME
          app.id=org.thunderdog.challegram.custom
          app.name=Telegram X
          telegram.api_id=21724
          telegram.api_hash=3e0cb5efcd52300aec5994fdfc5bdc16
          EOF

      - name: Validate Git Setup
        run: ./gradlew :app:validateGitSetup

      - name: Apply Patches
        run: python3 scripts/patch.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Optimized Release APK
        run: |
          ABI="${{ github.event.inputs.abi || 'arm64' }}"
          chmod +x gradlew
          ./gradlew :app:assembleLatestRelease -Pabi=$ABI --stacktrace

      - name: Sign Release APK
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*latest*.apk" | head -n 1)
          echo "Found APK at $APK_PATH"
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign --ks release.jks --ks-key-alias tgx --ks-pass pass:telegramx --key-pass pass:telegramx --out app/build/outputs/apk/Telegram-X-Release.apk "$APK_PATH"

      - name: Upload Optimized Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-X-Release
          path: app/build/outputs/apk/Telegram-X-Release.apk
          retention-days: 14
