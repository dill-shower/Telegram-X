name: Build Telegram X

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      abi:
        description: 'Target ABI (e.g. arm64, arm32, x64)'
        required: true
        default: 'arm64'

env:
  TERM: xterm
  RUSTUP_HOME: /home/runner/.rustup
  CARGO_HOME: /home/runner/.cargo

jobs:
  build:
    name: Build APK (${{ github.event.inputs.abi || 'arm64' }})
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository with Submodules and LFS
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 1

      - name: Expand Swap Space (Prevent OOM)
        run: |
          sudo swapoff -a
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Exact Rust Toolchain & Targets
        run: |
          RUST_VERSION=$(grep "^version.rust=" version.properties | cut -d'=' -f2 | tr -d '\r\n ')
          echo "Target Rust version: $RUST_VERSION"

          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

          rustup target add aarch64-linux-android --toolchain "$RUST_VERSION"
          rustup target add armv7-linux-androideabi --toolchain "$RUST_VERSION"
          rustup target add x86_64-linux-android --toolchain "$RUST_VERSION"
          rustup target add i686-linux-android --toolchain "$RUST_VERSION"
          rustup component add llvm-tools --toolchain "$RUST_VERSION" || true

          chmod +x scripts/setup-rust.sh
          ./scripts/setup-rust.sh || true

          echo "$CARGO_HOME/bin" >> $GITHUB_PATH

          cat <<EOF > local.properties
          sdk.dir=$ANDROID_HOME
          rust.dir=$RUSTUP_HOME
          telegram.api_id=21724
          telegram.api_hash=3e0cb5efcd52300aec5913f0008670bc
          EOF

      - name: Validate Git Setup
        run: ./gradlew :app:validateGitSetup

      - name: Apply Exact In-Place Patches
        run: |
          python3 - << 'EOF'
          def patch_file(path, replacements):
              with open(path, 'r', encoding='utf-8') as f:
                  content = f.read()
              for old, new in replacements:
                  if old not in content:
                      print(f"[!] Warning: pattern not found in {path}:\n{old[:60]}...")
                  else:
                      content = content.replace(old, new, 1)
                      print(f"[+] Replaced in {path}")
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(content)

          # 1. MessagesLoader.java — убираем рекламу каналов
          patch_file('app/src/main/java/org/thunderdog/challegram/component/chat/MessagesLoader.java', [
              ('private boolean canShowSponsoredMessage (long chatId) {\n    return tdlib.isChannel(chatId)',
               'private boolean canShowSponsoredMessage (long chatId) {\n    if (true) return false;\n    return tdlib.isChannel(chatId)')
          ])

          # 2. TGMessage.java — разрешаем сохранение и копирование всего
          patch_file('app/src/main/java/org/thunderdog/challegram/data/TGMessage.java', [
              ('public boolean canBeSaved () {\n    return message != null && message.canBeSaved;',
               'public boolean canBeSaved () {\n    if (true) return true;\n    return message != null && message.canBeSaved;')
          ])

          # 3. MessagesController.java — скриншоты везде + глушим статус "печатает"
          patch_file('app/src/main/java/org/thunderdog/challegram/ui/MessagesController.java', [
              ('public final boolean shouldDisallowScreenshots () {\n    return !Config.ENABLE_TEST_HOOKS',
               'public final boolean shouldDisallowScreenshots () {\n    if (true) return false;\n    return !Config.ENABLE_TEST_HOOKS'),
              ('public void setChatAction (@TdApi.ChatAction.Constructors int action, boolean set, boolean force) {\n    if (chat == null) {',
               'public void setChatAction (@TdApi.ChatAction.Constructors int action, boolean set, boolean force) {\n    if (true) return;\n    if (chat == null) {')
          ])

          # 4. Tdlib.java — Premium, отпечаток подписи, цензура, Play Integrity
          patch_file('app/src/main/java/org/thunderdog/challegram/telegram/Tdlib.java', [
              # Client-side Premium
              ('public boolean hasPremium () {\n    TdApi.User user = cache().myUser();',
               'public boolean hasPremium () {\n    if (true) return true;\n    TdApi.User user = cache().myUser();'),

              # Снятие ограничений NSFW / Sensitive
              ('public boolean ignoreSensitiveContentRestrictions () {\n    return options.ignoreSensitiveContentRestrictions;',
               'public boolean ignoreSensitiveContentRestrictions () {\n    if (true) return true;\n    return options.ignoreSensitiveContentRestrictions;'),

              # Снятие ограничений платформы
              ('new TdApi.OptionValueBoolean(AppInstallationUtil.isAppSideLoaded(AppContext.get())))',
               'new TdApi.OptionValueBoolean(true))'),

              # Подделка официального отпечатка подписи Вячеслава Крылова
              ('String fingerprint = U.getApkFingerprint("SHA1", false);\n    if (!StringUtils.isEmpty(fingerprint)) {\n      params.put("data", fingerprint);\n    }',
               'params.put("data", "66462134345a6adac3c1d5aea9cef0421b7cab68");'),

              # Заглушка Play Integrity API
              ('public void requestPlayIntegrity (long verificationId, String nonce, ApplicationVerificationCallback callback) {\n    TDLib.Tag.playIntegrity',
               'public void requestPlayIntegrity (long verificationId, String nonce, ApplicationVerificationCallback callback) {\n    callback.onApplicationVerificationResult("PLAYINTEGRITY_FAILED_NOT_SUPPORTED");\n    if (true) return;\n    TDLib.Tag.playIntegrity'),

              # Отмена телеметрии OpenChat и CloseChat
              ('client().send(new TdApi.OpenChat(chatId),',
               '// client().send(new TdApi.OpenChat(chatId),'),
              ('client().send(new TdApi.CloseChat(chatId), okHandler());',
               '// client().send(new TdApi.CloseChat(chatId), okHandler());')
          ])
          print("Done patching.")
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          ABI="${{ github.event.inputs.abi || 'arm64' }}"
          chmod +x gradlew
          ./gradlew :app:assembleLatestDebug -Pabi=$ABI --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-X-${{ github.event.inputs.abi || 'arm64' }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14
